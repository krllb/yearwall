name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - run: swift test

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Sources/Yearwall/Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" Sources/Yearwall/Info.plist

      - name: Build universal app
        run: Scripts/make-app.sh release --universal

      - name: Package
        run: ditto -c -k --keepParent build/Yearwall.app "build/Yearwall-$VERSION.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/Yearwall-$VERSION.zip" --title "Yearwall $VERSION" --generate-notes
